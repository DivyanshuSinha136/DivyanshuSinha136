<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="326" viewBox="0 0 1100 326" role="img" aria-label="Programming languages: Python, Lua, Go, JavaScript, Rust, C++, C, NASM for AMD, ARM, System V, ARMhf and RISC-V, bare machine code and AML" xmlns:c2pa="http://c2pa.org/manifest"><style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes rise{from{opacity:0}to{opacity:1}}@keyframes dash{to{stroke-dashoffset:-12}}@keyframes glowbox{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1500px)}}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 5s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.chip{animation:rise .7s ease-out both}.flow{stroke-dasharray:6 6;animation:dash 1.1s linear infinite}.glowbox{animation:glowbox 3.2s ease-in-out infinite}.sweep{animation:sweep 4.5s linear infinite}@media (prefers-reduced-motion:reduce){.float,.pulse,.blink,.chip,.flow,.glowbox,.sweep{animation:none!important}}</style><metadata><c2pa:manifest></c2pa:manifest></metadata>
