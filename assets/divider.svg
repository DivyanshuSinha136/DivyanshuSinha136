<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4" viewBox="0 0 1200 4" xmlns:c2pa="http://c2pa.org/manifest"><style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes rise{from{opacity:0}to{opacity:1}}@keyframes dash{to{stroke-dashoffset:-12}}@keyframes glowbox{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(1500px)}}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 5s ease-in-out infinite}.blink{animation:blink 1.1s steps(1) infinite}.chip{animation:rise .7s ease-out both}.flow{stroke-dasharray:6 6;animation:dash 1.1s linear infinite}.glowbox{animation:glowbox 3.2s ease-in-out infinite}.sweep{animation:sweep 4.5s linear infinite}@media (prefers-reduced-motion:reduce){.float,.pulse,.blink,.chip,.flow,.glowbox,.sweep{animation:none!important}}</style><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset="0.5" stop-color="#34d399"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><defs><linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect y="1" width="1200" height="2" rx="1" fill="url(#g)"/><rect class="sweep" x="-300" y="0" width="300" height="4" rx="2" fill="url(#sw)"/></svg>